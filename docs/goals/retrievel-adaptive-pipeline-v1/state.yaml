version: 2

goal:
  title: "retrieVEL adaptive pipeline V1"
  slug: retrievel-adaptive-pipeline-v1
  kind: existing_plan
  tranche: "Land the review candidates, then implement and validate the source-bound multi-language graph and optional Jev pipeline through successive verified milestones."
  status: active
  oracle:
    signal: "The installed product passes source-authority, relation-coverage, projection, live-provider, and end-to-end time-to-correct gates on the final merged candidate."
    cadence: "After each Worker package and at each provider, benchmark, merge, and final-audit boundary."
    final_proof: "A final independent audit maps current receipts, merged Git state, installed-path validation, aggregate provider spend, and a sealed four-arm result to the original owner outcome."
  intake:
    original_request: "Resume the goal with the updated graph, connector-node, Obsidian-mode, and Jev budget recommendations and keep the GoalBuddy record active."
    interpreted_outcome: "Produce a community-ready source-bound repository graph whose task projections and optional Jev judgment improve accepted correctness, context efficiency, or wall-clock time without unsupported claims."
    input_shape: existing_plan
    audience: "VelGraphing maintainers and plugin adopters"
    authority: approved
    proof_type: metric
    completion_proof: "Merged and installable product, source-bound multi-language relation coverage, exact live Jev canary, sealed four-arm correctness and wall-clock study, and independent final audit."
    likely_misfire: "Treating a larger graph, a successful provider rerank, reduced request tokens, or a retrieval-only benchmark as proof of end-to-end value."
    blind_spots_considered:
      - "Cross-language relations require deterministic identity resolution after language-specific parsing."
      - "Connector nodes are derived navigation identities and must not replace source or symbol authority."
      - "Obsidian-style modes must be projections over one graph, not duplicated graph stores."
      - "Provider authorization is a dollar ledger, not a fixed call count."
      - "The prior 46 live calls did not exercise the exact final installed PR #11 path."
    existing_plan_facts:
      - "PR #11 is the product candidate and must merge first."
      - "PR #12 is an evidence-only candidate stacked on PR #11 and must merge second after retargeting to main."
      - "T030 is closed unresolved and remains historical evidence."
      - "No Graph plus Jev performance claim is currently supported."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

